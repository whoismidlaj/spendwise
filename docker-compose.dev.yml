services:
  spendwise-postgres-db:
    image: postgres:16-alpine
    container_name: spendwise-postgres-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
    volumes:
      - spendwise_postgres_dev_data:/var/lib/postgresql/data
    networks:
      - spendwise-dev-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendwise-web-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
      DATABASE_HOST: spendwise-postgres-db
      DATABASE_PORT: "5432"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-spendwise-super-secret-key-dev-32chars-min}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - spendwise-postgres-db
    networks:
      - spendwise-dev-network

networks:
  spendwise-dev-network:
    driver: bridge

volumes:
  spendwise_postgres_dev_data:
